<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}GRID CONTROL — Feu Rouge{% endblock %}</title>

<script>
(function(){
    try {
        var saved = localStorage.getItem('gc-theme');
        var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (sysDark ? 'dark' : 'light'));
    } catch(e){}
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<style>
/* ========================================================================
   GRID CONTROL — Design System v3
   Layout : top bar + left icon rail (64px) + bento content
   Style : éditorial, courbes douces, palette sunset, typographie serif
   ======================================================================== */
* { margin: 0; padding: 0; box-sizing: border-box; }

/* =====================================================
   TOKENS — DARK (défaut)
   ===================================================== */
:root, html[data-theme="dark"] {
    --bg: #0e0f14;
    --bg-2: #151720;
    --surface: #1a1d28;
    --surface-2: #232735;
    --surface-3: #2c3142;
    --border: #2f3446;
    --border-soft: #252938;

    --text: #f5f3f0;
    --text-mid: #a8aebc;
    --text-lo: #6b7185;

    --coral: #ff6b6b;
    --coral-soft: rgba(255, 107, 107, 0.14);
    --amber: #ffd93d;
    --amber-soft: rgba(255, 217, 61, 0.14);
    --indigo: #4d5dfb;
    --indigo-soft: rgba(77, 93, 251, 0.16);
    --mint: #4ade80;
    --mint-soft: rgba(74, 222, 128, 0.14);
    --rose: #f472b6;

    --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);

    --radius: 20px;
    --radius-sm: 12px;
    --radius-pill: 999px;

    --page-bg: #0e0f14;
    --grid-bg: rgba(255, 255, 255, 0.02);
    --leaflet-filter: brightness(0.72) saturate(0.9) hue-rotate(180deg) invert(0.92);
}

/* =====================================================
   TOKENS — LIGHT
   ===================================================== */
html[data-theme="light"] {
    --bg: #f7f5f2;
    --bg-2: #efece7;
    --surface: #ffffff;
    --surface-2: #f8f6f3;
    --surface-3: #efece7;
    --border: #e4dfd8;
    --border-soft: #ebe7e0;

    --text: #1a1a1f;
    --text-mid: #5c5f6b;
    --text-lo: #909399;

    --coral: #e85050;
    --coral-soft: rgba(232, 80, 80, 0.10);
    --amber: #d4a017;
    --amber-soft: rgba(212, 160, 23, 0.10);
    --indigo: #3a47c9;
    --indigo-soft: rgba(58, 71, 201, 0.10);
    --mint: #16a34a;
    --mint-soft: rgba(22, 163, 74, 0.10);
    --rose: #d946a0;

    --shadow: 0 8px 32px rgba(26, 26, 31, 0.08);
    --shadow-sm: 0 2px 8px rgba(26, 26, 31, 0.06);

    --page-bg: #f7f5f2;
    --grid-bg: rgba(0, 0, 0, 0.02);
    --leaflet-filter: none;
}

/* =====================================================
   BASE
   ===================================================== */
html, body {
    height: 100%;
}
body {
    font-family: 'DM Sans', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: grid;
    grid-template-columns: 64px 1fr;
    grid-template-rows: 72px 1fr;
    grid-template-areas:
        "rail topbar"
        "rail main";
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
}

/* =====================================================
   LEFT ICON RAIL (64px) — pas une sidebar classique
   ===================================================== */
.rail {
    grid-area: rail;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px 0;
    gap: 6px;
    position: sticky;
    top: 0;
    height: 100vh;
    z-index: 100;
}
.rail-logo {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--coral), var(--rose));
    display: grid;
    place-items: center;
    font-size: 22px;
    margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
    cursor: pointer;
    transition: transform 0.2s;
}
.rail-logo:hover { transform: scale(1.06) rotate(-5deg); }

.rail-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
    width: 100%;
    align-items: center;
    overflow-y: auto;
    padding: 0 8px;
}
.rail-nav::-webkit-scrollbar { width: 0; }

.rail-item {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-lo);
    text-decoration: none;
    position: relative;
    transition: all 0.2s;
    cursor: pointer;
}
.rail-item i { font-size: 16px; }
.rail-item:hover {
    background: var(--surface-2);
    color: var(--text);
}
.rail-item.active {
    background: var(--surface-3);
    color: var(--text);
}
.rail-item.active::before {
    content: '';
    position: absolute;
    left: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 24px;
    background: var(--coral);
    border-radius: 0 3px 3px 0;
    box-shadow: 0 0 12px var(--coral);
}

/* Tooltip au survol */
.rail-item::after {
    content: attr(data-label);
    position: absolute;
    left: 60px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--surface-3);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    z-index: 1000;
}
.rail-item:hover::after {
    opacity: 1;
    transform: translateY(-50%) translateX(4px);
}

.rail-bottom {
    padding-top: 12px;
    border-top: 1px solid var(--border);
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}

/* =====================================================
   TOP BAR (72px)
   ===================================================== */
.topbar {
    grid-area: topbar;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 32px;
    position: sticky;
    top: 0;
    z-index: 90;
}

.topbar-left {
    display: flex;
    align-items: baseline;
    gap: 16px;
}

.breadcrumb {
    font-family: 'Instrument Serif', serif;
    font-size: 26px;
    font-weight: 400;
    font-style: italic;
    color: var(--text);
    letter-spacing: -0.5px;
}
.breadcrumb span { color: var(--text-lo); font-style: normal; font-family: 'DM Sans', sans-serif; font-size: 12px; margin-left: 10px; letter-spacing: 0; text-transform: uppercase; font-weight: 500; }

.topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-mid);
}
.status-pill .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--mint);
    box-shadow: 0 0 8px var(--mint);
    animation: breathe 2s ease-in-out infinite;
}
@keyframes breathe {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
}

.theme-toggle {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    cursor: pointer;
    display: grid;
    place-items: center;
    font-size: 15px;
    transition: all 0.2s;
}
.theme-toggle:hover {
    background: var(--surface-3);
    transform: rotate(20deg) scale(1.05);
}

/* =====================================================
   MAIN CONTENT (bento grid)
   ===================================================== */
main {
    grid-area: main;
    padding: 24px 32px 48px;
    overflow-y: auto;
    height: calc(100vh - 72px);
}

/* =====================================================
   BENTO GRID — le cœur du nouveau design
   ===================================================== */
.bento {
    display: grid;
    gap: 16px;
    grid-template-columns: repeat(12, 1fr);
}
.bento > * {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: all 0.25s;
}
.bento > *:hover {
    border-color: var(--border-soft);
}

/* Tailles bento */
.b-3 { grid-column: span 3; }
.b-4 { grid-column: span 4; }
.b-5 { grid-column: span 5; }
.b-6 { grid-column: span 6; }
.b-7 { grid-column: span 7; }
.b-8 { grid-column: span 8; }
.b-9 { grid-column: span 9; }
.b-12 { grid-column: span 12; }

/* Bento titles */
.bento-title {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-lo);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
}
.bento-title i {
    font-size: 11px;
    color: var(--coral);
}
.bento-title .num {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-lo);
    font-weight: 400;
    letter-spacing: 0.5px;
}

/* Big numbers */
.bento-big {
    font-family: 'DM Sans', sans-serif;
    font-size: 48px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: -2px;
    color: var(--text);
    margin-bottom: 8px;
}
.bento-big .unit {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-lo);
    letter-spacing: 0;
    margin-left: 8px;
}
.bento-sub {
    font-size: 12px;
    color: var(--text-mid);
}

/* =====================================================
   FEUX HORIZONTAUX (nouveauté clé)
   ===================================================== */
.traffic-h {
    background: var(--bg-2);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
}
.traffic-h::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, var(--coral-soft), transparent 70%);
    opacity: 0;
    transition: opacity 0.4s;
}
.traffic-h.active::before { opacity: 1; }
.traffic-h.active { border-color: var(--coral); box-shadow: 0 0 0 1px var(--coral), 0 8px 32px rgba(255,107,107,0.2); }

.traffic-h-label {
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-mid);
    margin-bottom: 14px;
}

.traffic-h-lights {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
}
.h-light {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--surface-3);
    border: 1px solid var(--border);
    transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
}
.h-light.red.on {
    background: var(--coral);
    border-color: var(--coral);
    box-shadow: 0 0 24px var(--coral), 0 0 48px rgba(255,107,107,0.4);
    transform: scale(1.08);
}
.h-light.yellow.on {
    background: var(--amber);
    border-color: var(--amber);
    box-shadow: 0 0 24px var(--amber), 0 0 48px rgba(255,217,61,0.4);
    transform: scale(1.08);
}
.h-light.green.on {
    background: var(--mint);
    border-color: var(--mint);
    box-shadow: 0 0 24px var(--mint), 0 0 48px rgba(74,222,128,0.4);
    transform: scale(1.08);
}

/* =====================================================
   BOUTONS PILL
   ===================================================== */
.btn {
    padding: 10px 20px;
    border: 1px solid transparent;
    border-radius: var(--radius-pill);
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-flex;
    gap: 8px;
    align-items: center;
    justify-content: center;
    text-decoration: none;
}
.btn-primary {
    background: var(--coral);
    color: #fff;
    border-color: var(--coral);
}
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 8px 20px rgba(255,107,107,0.3); }

.btn-secondary {
    background: var(--surface-2);
    color: var(--text);
    border-color: var(--border);
}
.btn-secondary:hover { background: var(--surface-3); border-color: var(--border-soft); }

.btn-ghost {
    background: transparent;
    color: var(--text-mid);
    border-color: var(--border);
}
.btn-ghost:hover { color: var(--coral); border-color: var(--coral); background: var(--coral-soft); }

.btn-danger {
    background: var(--coral);
    color: #fff;
    border-color: var(--coral);
}
.btn-danger:hover { filter: brightness(1.1); }

.btn-sm { padding: 7px 14px; font-size: 12px; }

/* =====================================================
   MODE SELECTOR (pills)
   ===================================================== */
.mode-pills {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.mode-pill {
    padding: 10px 18px;
    border-radius: var(--radius-pill);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-mid);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    gap: 8px;
    align-items: center;
    transition: all 0.2s;
}
.mode-pill i { font-size: 11px; }
.mode-pill:hover { color: var(--text); border-color: var(--border-soft); }
.mode-pill.active {
    background: var(--coral);
    color: #fff;
    border-color: var(--coral);
    box-shadow: 0 4px 16px rgba(255,107,107,0.3);
}

/* =====================================================
   INPUTS
   ===================================================== */
.input, .chat-input, select.chat-input, input.chat-input {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    transition: all 0.15s;
}
.input:focus, .chat-input:focus {
    outline: none;
    border-color: var(--coral);
    box-shadow: 0 0 0 3px var(--coral-soft);
}
.input::placeholder, .chat-input::placeholder { color: var(--text-lo); }

select, select option {
    background: var(--surface-2);
    color: var(--text);
}

/* =====================================================
   LED ITEMS (control page)
   ===================================================== */
.led-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 20px;
    text-align: center;
    transition: all 0.2s;
}
.led-card:hover { border-color: var(--border-soft); background: var(--surface-3); }
.led-dot {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--surface-3);
    border: 2px solid var(--border);
    margin: 0 auto 14px;
    opacity: 0.3;
    transition: all 0.3s;
}
.led-dot.on { opacity: 1; transform: scale(1.05); }
.led-dot.red { background: #4a1a1a; }
.led-dot.red.on { background: var(--coral); border-color: var(--coral); box-shadow: 0 0 24px var(--coral); }
.led-dot.yellow { background: #4a3a1a; }
.led-dot.yellow.on { background: var(--amber); border-color: var(--amber); box-shadow: 0 0 24px var(--amber); }
.led-dot.green { background: #1a4a2a; }
.led-dot.green.on { background: var(--mint); border-color: var(--mint); box-shadow: 0 0 24px var(--mint); }
.led-card h4 {
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-mid);
    margin-bottom: 12px;
}
.led-actions {
    display: flex;
    gap: 6px;
    justify-content: center;
}
.led-actions .btn { padding: 6px 12px; font-size: 11px; }

/* =====================================================
   STATS / ANALYTICS
   ===================================================== */
.stat-box {
    text-align: left;
}
.stat-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--text-lo);
    margin-bottom: 10px;
    font-family: 'DM Sans', sans-serif;
}
.stat-value {
    font-family: 'DM Sans', sans-serif;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1.5px;
    color: var(--text);
    line-height: 1;
    margin-bottom: 6px;
}
.stat-sub {
    font-size: 11px;
    color: var(--text-lo);
    font-family: 'JetBrains Mono', monospace;
}

/* =====================================================
   CHAT
   ===================================================== */
.chat-box {
    height: 380px;
    overflow-y: auto;
    background: var(--bg-2);
    border-radius: var(--radius-sm);
    padding: 18px;
    margin-bottom: 14px;
    border: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
}
.chat-box::-webkit-scrollbar { width: 6px; }
.chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.chat-msg {
    padding: 11px 16px;
    border-radius: 18px;
    max-width: 78%;
    font-size: 13px;
    line-height: 1.5;
    animation: slideIn 0.25s ease-out;
}
@keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
}
.chat-msg.user {
    background: var(--coral);
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
}
.chat-msg.bot {
    background: var(--surface-2);
    color: var(--text);
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border: 1px solid var(--border);
}

/* =====================================================
   MAP
   ===================================================== */
#map {
    width: 100%;
    height: 100%;
    border-radius: var(--radius-sm);
    z-index: 1;
}
.leaflet-tile { filter: var(--leaflet-filter); }
.leaflet-container { background: var(--bg-2) !important; }
.map-container {
    height: calc(100vh - 200px);
    min-height: 500px;
    padding: 0 !important;
    overflow: hidden;
}

/* =====================================================
   INCIDENTS
   ===================================================== */
.incident-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--coral);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
}
.incident-card h4 {
    font-size: 13px;
    font-weight: 600;
    color: var(--coral);
    margin-bottom: 4px;
}
.incident-card p {
    font-size: 11px;
    color: var(--text-lo);
    margin: 2px 0;
}

/* =====================================================
   DROP ZONE
   ===================================================== */
.drop-zone {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface-2);
}
.drop-zone:hover {
    border-color: var(--coral);
    background: var(--coral-soft);
}

/* =====================================================
   TOAST
   ===================================================== */
.toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    padding: 14px 22px;
    border-radius: var(--radius-pill);
    background: var(--surface-3);
    color: var(--text);
    font-weight: 500;
    font-size: 13px;
    opacity: 0;
    transform: translateY(12px);
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 9999;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    border-left: 3px solid var(--mint);
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.error { border-left-color: var(--coral); }

/* =====================================================
   SCROLLBARS
   ===================================================== */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-soft); }

/* =====================================================
   TABLES
   ===================================================== */
table {
    width: 100%;
    border-collapse: collapse;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
}
thead { background: var(--surface-2); }
th {
    padding: 12px 14px;
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-lo);
    border-bottom: 1px solid var(--border);
}
td {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border-soft);
    color: var(--text-mid);
}
tr:hover td { background: var(--surface-2); }

/* =====================================================
   RESPONSIVE
   ===================================================== */
@media (max-width: 1200px) {
    .b-3, .b-4, .b-5 { grid-column: span 6; }
    .b-7, .b-8, .b-9 { grid-column: span 12; }
}
@media (max-width: 768px) {
    body { grid-template-columns: 0 1fr; }
    .rail { display: none; }
    .bento > * { grid-column: span 12 !important; }
    main { padding: 16px; }
    .topbar { padding: 0 16px; }
    .breadcrumb { font-size: 20px; }
    .traffic-h-lights { gap: 6px; }
    .h-light { width: 42px; height: 42px; }
}

/* Animations */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
}
.bento > * { animation: fadeUp 0.35s ease-out both; }
.bento > *:nth-child(1) { animation-delay: 0.02s; }
.bento > *:nth-child(2) { animation-delay: 0.06s; }
.bento > *:nth-child(3) { animation-delay: 0.10s; }
.bento > *:nth-child(4) { animation-delay: 0.14s; }
.bento > *:nth-child(5) { animation-delay: 0.18s; }
.bento > *:nth-child(6) { animation-delay: 0.22s; }

/* Override feux tricolores legacy */
.light, .light-stack, .traffic-light { display: none; }
</style>
</head>
<body>

<!-- RAIL -->
<aside class="rail">
    <div class="rail-logo" title="GRID CONTROL">🚦</div>
    <nav class="rail-nav">
        <a href="/" class="rail-item {% if active == 'dashboard' %}active{% endif %}" data-label="Dashboard"><i class="fas fa-th-large"></i></a>
        <a href="/control" class="rail-item {% if active == 'control' %}active{% endif %}" data-label="Contrôle LEDs"><i class="fas fa-sliders-h"></i></a>
        <a href="/voice" class="rail-item {% if active == 'voice' %}active{% endif %}" data-label="Voix"><i class="fas fa-microphone"></i></a>
        <a href="/automatic" class="rail-item {% if active == 'automatic' %}active{% endif %}" data-label="Timer"><i class="fas fa-clock"></i></a>
        <a href="/map" class="rail-item {% if active == 'map' %}active{% endif %}" data-label="Carte"><i class="fas fa-map-marked-alt"></i></a>
        <a href="/video" class="rail-item {% if active == 'video' %}active{% endif %}" data-label="Vidéo"><i class="fas fa-video"></i></a>
        <a href="/incidents" class="rail-item {% if active == 'incidents' %}active{% endif %}" data-label="Incidents"><i class="fas fa-exclamation-triangle"></i></a>
        <a href="/analytics" class="rail-item {% if active == 'analytics' %}active{% endif %}" data-label="Analytics"><i class="fas fa-chart-line"></i></a>
        <a href="/n8n" class="rail-item {% if active == 'n8n' %}active{% endif %}" data-label="N8N"><i class="fas fa-bolt"></i></a>
        <a href="/chat" class="rail-item {% if active == 'chat' %}active{% endif %}" data-label="Chat IA"><i class="fas fa-robot"></i></a>
    </nav>
</aside>

<!-- TOP BAR -->
<header class="topbar">
    <div class="topbar-left">
        <div class="breadcrumb">
            {% block navbar_title %}Système de Feux Intelligents{% endblock %}
            <span>{% block subtitle %}Live Control{% endblock %}</span>
        </div>
    </div>
    <div class="topbar-right">
        <div class="status-pill">
            <span class="dot"></span>
            <span id="topStatusText">Mode Manuel</span>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Basculer thème">
            <i class="fas fa-moon"></i>
        </button>
    </div>
</header>

<!-- MAIN -->
<main>
    {% block content %}{% endblock %}
</main>

<div id="toast" class="toast">Action effectuée</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- THEME TOGGLE -->
<script>
(function () {
    const KEY = 'gc-theme';
    function apply(t) {
        document.documentElement.setAttribute('data-theme', t);
        const b = document.getElementById('themeToggle');
        if (b) b.innerHTML = t === 'dark' ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }
    function init() {
        const s = localStorage.getItem(KEY);
        return (s === 'dark' || s === 'light') ? s : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
    apply(init());
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('themeToggle')?.addEventListener('click', () => {
            const c = document.documentElement.getAttribute('data-theme');
            const n = c === 'dark' ? 'light' : 'dark';
            apply(n); localStorage.setItem(KEY, n);
        });
    });
})();
</script>

<!-- ============================================================
     LOGIQUE MÉTIER — INCHANGÉE (toutes les fonctions originales)
     ============================================================ -->
<script>
function initVoiceControl() {
    const voiceBtn = document.getElementById('voiceBtn');
    const voiceStatus = document.getElementById('voiceStatus');
    if (!voiceBtn || !voiceStatus) return;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        voiceStatus.innerText = "❌ Navigateur non compatible.";
        voiceBtn.disabled = true;
        return;
    }
    const recognition = new SpeechRecognition();
    recognition.lang = 'fr-FR';
    recognition.continuous = false;
    recognition.interimResults = false;
    voiceBtn.addEventListener('click', () => {
        try {
            recognition.start();
            voiceBtn.classList.add('btn-danger');
            voiceBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Écoute...';
            voiceStatus.innerText = "🎤 Parlez maintenant...";
        } catch (e) { voiceStatus.innerText = "Erreur micro."; }
    });
    recognition.onend = () => {
        voiceBtn.classList.remove('btn-danger');
        voiceBtn.innerHTML = '<i class="fas fa-microphone"></i> Appuyer pour parler';
        voiceStatus.innerText = "Traitement...";
    };
    recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        voiceStatus.innerText = `🗣️ "${transcript}"`;
        try {
            const res = await fetch('/api/chat', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ question: transcript }) });
            const data = await res.json();
            voiceStatus.innerHTML = `✅ <b>Action :</b> ${data.answer}`;
            speakResponse(data.answer);
        } catch (e) { voiceStatus.innerText = "❌ Erreur serveur."; }
    };
    recognition.onerror = (event) => { voiceStatus.innerText = "❌ Erreur : " + event.error; };
}
function speakResponse(text) {
    const s = new SpeechSynthesisUtterance(text);
    s.lang = 'fr-FR';
    window.speechSynthesis.speak(s);
}

document.querySelectorAll('.mode-btn, .mode-pill').forEach(btn => {
    btn.addEventListener('click', async function() {
        const mode = this.getAttribute('data-mode');
        updateModeUI(mode);
        try {
            await fetch('/api/set_mode', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ mode }) });
            showToast(`Mode ${mode} activé`);
        } catch(e) { showToast('Erreur mode', 'error'); }
    });
});

function updateModeUI(mode) {
    document.querySelectorAll('.mode-btn, .mode-pill').forEach(b => b.classList.remove('active'));
    document.querySelectorAll(`[data-mode="${mode}"]`).forEach(b => b.classList.add('active'));
    const panel = document.getElementById('switchingControls');
    const msg = document.getElementById('manualMsg');
    if (panel && msg) {
        if (mode === 'switching') { panel.style.display = 'block'; msg.style.display = 'none'; }
        else { panel.style.display = 'none'; msg.style.display = 'block'; }
    }
    const st = document.getElementById('topStatusText');
    if(st) st.innerText = "Mode " + mode.toUpperCase();
}

async function fetchStatus() {
    try {
        const res = await fetch('/api/status');
        const data = await res.json();
        const currentActive = document.querySelector('.mode-btn.active, .mode-pill.active');
        if (!currentActive || currentActive.getAttribute('data-mode') !== data.control_mode) {
            updateModeUI(data.control_mode);
        }
        for(let k in data.leds) {
            const el = document.getElementById(k);
            const el2 = document.getElementById('led'+k.charAt(0).toUpperCase()+k.slice(1));
            if(el) el.classList.toggle('on', data.leds[k]);
            if(el2) el2.classList.toggle('on', data.leds[k]);
        }
        const tl1 = document.getElementById('trafficLight1');
        const tl2 = document.getElementById('trafficLight2');
        if(tl1) tl1.classList.toggle('active', data.current_traffic_light===1);
        if(tl2) tl2.classList.toggle('active', data.current_traffic_light===2);
        if(data.stats) {
            const sc = document.getElementById('statCars');
            const sp = document.getElementById('statPedestrians');
            if(sc) sc.innerText = data.stats.cars || 0;
            if(sp) sp.innerText = data.stats.pedestrians || 0;
        }
        const n8 = document.getElementById('n8nStatus');
        if(n8) n8.innerText = data.n8n_enabled ? "Connecté ✅" : "Désactivé ❌";
    } catch(e) {}
}

async function apiCall(url, data) {
    try {
        const res = await fetch(url, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(data) });
        const json = await res.json();
        if(json.ok) { showToast("Commande envoyée"); fetchStatus(); }
        else { showToast(json.error || "Erreur", "error"); }
    } catch(e) { showToast("Erreur API", "error"); }
}

window.switchTrafficLight = (t) => apiCall('/api/switch', {target:t});
window.pauseTrafficLights = () => apiCall('/api/pause', {});
window.resumeTrafficLights = () => apiCall('/api/resume', {});
window.setLED = (cmd) => apiCall('/api/set_led', {cmd});
window.detectTrafficIncidents = async () => {
    showToast("📡 Scan en cours...", "info");
    try {
        const res = await fetch('/api/detect_traffic_incidents', { method: 'POST', headers: {'Content-Type': 'application/json'} });
        const data = await res.json();
        if (data.ok) {
            if (data.incidents && data.incidents.length > 0) showToast(`⚠️ ${data.incidents.length} détecté(s) !`, "error");
            else showToast("✅ Aucun incident.", "success");
            loadIncidents();
            if(typeof updateMapMarkers === 'function') updateMapMarkers();
        } else showToast("❌ " + (data.error || "Erreur"), "error");
    } catch (e) { showToast("❌ Connexion", "error"); }
};

window.createIncident = async () => {
    const type = document.getElementById('incType').value;
    await apiCall('/api/incidents', {type, light_id:1, severity:'medium'});
    loadIncidents();
};

let map, markers = {};
function initMap() {
    const mapEl = document.getElementById('map');
    if (!mapEl || typeof L === 'undefined') return;
    map = L.map('map').setView([33.2585, -8.5087], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OSM' }).addTo(map);
    setInterval(updateMapMarkers, 3000);
}
function getColoredIcon(color) {
    let url = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png';
    if(color === 'green') url = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png';
    if(color === 'yellow') url = 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-gold.png';
    return new L.Icon({ iconUrl: url, shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png', iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41] });
}
async function updateMapMarkers() {
    try {
        const r1 = await fetch('/api/map'); const d1 = await r1.json();
        const r2 = await fetch('/api/incidents'); const d2 = await r2.json();
        d1.lights.forEach(l => {
            let color = l.status === 'green' ? 'green' : (l.status === 'yellow' ? 'yellow' : 'red');
            let pos = [l.position.lat, l.position.lng];
            if (!markers[l.id]) markers[l.id] = L.marker(pos, {icon: getColoredIcon(color)}).addTo(map).bindPopup(`<strong>${l.name}</strong><br>${l.status.toUpperCase()}`);
            else markers[l.id].setIcon(getColoredIcon(color));
        });
        d2.incidents.forEach(inc => {
            let key = 'inc_' + inc.id;
            if (inc.coordinates && !markers[key]) {
                markers[key] = L.marker([inc.coordinates.lat, inc.coordinates.lng]).addTo(map).bindPopup(`<strong>⚠️ ${inc.type}</strong><br>${inc.location}`);
            }
        });
    } catch(e) {}
}

window.fillChat = (text) => { document.getElementById('chatInput').value = text; sendChat(); };
async function sendChat() {
    const i = document.getElementById('chatInput');
    if (!i) return;
    const t = i.value; if(!t) return;
    document.getElementById('chatBox').innerHTML += `<div class="chat-msg user">${t}</div>`;
    i.value="";
    const res = await fetch('/api/chat', {method:'POST', body:JSON.stringify({question:t})});
    const d = await res.json();
    document.getElementById('chatBox').innerHTML += `<div class="chat-msg bot">${d.answer}</div>`;
    const cb = document.getElementById('chatBox');
    cb.scrollTop = cb.scrollHeight;
}

function showToast(msg, type='') {
    const t = document.getElementById('toast');
    t.innerText = msg; t.className = `toast show ${type}`;
    setTimeout(() => t.classList.remove('show'), 3000);
}

async function loadIncidents() {
    const listSmall = document.getElementById('incidentsList');
    const listFull = document.getElementById('incidentsListFull');
    if (!listSmall && !listFull) return;
    const res = await fetch('/api/incidents');
    const data = await res.json();
    if(listSmall) {
        listSmall.innerHTML = data.incidents.length ? data.incidents.map(i => `
            <div class="incident-card">
                <div>
                    <h4>${i.type}</h4>
                    <p>${new Date(i.timestamp).toLocaleTimeString()}</p>
                </div>
            </div>
        `).join('') : '<p style="text-align:center; color:var(--text-lo); font-size:13px; margin-top:20px;">Aucun incident</p>';
    }
    if(listFull) {
        listFull.innerHTML = data.incidents.length ? data.incidents.map(i => `
            <div class="incident-card">
                <div>
                    <h4>${i.type}</h4>
                    <p>Lieu: ${i.location} · Gravité: ${i.severity || 'Moyenne'}</p>
                    <p style="font-family:'JetBrains Mono',monospace; font-size:10px;">${i.timestamp}</p>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="apiCall('/api/incidents', {id:${i.id}, method:'DELETE'})">Clôturer</button>
            </div>
        `).join('') : '<div style="text-align:center; padding:40px; color:var(--text-lo);"><i class="fas fa-check-circle" style="font-size:36px; color:var(--mint); margin-bottom:8px;"></i><br>Aucun incident actif.</div>';
    }
}

async function loadAnalytics() {
    try {
        const avgEl = document.getElementById('avgVehicles');
        const cntEl = document.getElementById('historyCount');
        const tableDiv = document.getElementById('trafficHistoryTable');
        if (!avgEl && !cntEl && !tableDiv) return;
        const res = await fetch('/api/analytics');
        const data = await res.json();
        const history = data.history || [];
        if(history.length > 0) {
            let total = 0;
            history.forEach(h => total += (h.vehicles || 0));
            if(avgEl) avgEl.innerText = Math.round(total / history.length);
            if(cntEl) cntEl.innerText = history.length;
        }
        if(tableDiv) {
            if(history.length === 0) { tableDiv.innerHTML = '<p style="text-align:center; padding:20px; color:var(--text-lo);">Aucune donnée.</p>'; }
            else {
                let html = '<table><thead><tr><th>Heure</th><th>Voitures</th><th>Bus/Camions</th><th>Total</th></tr></thead><tbody>';
                history.slice().reverse().forEach(row => {
                    const s = row.stats || {};
                    html += `<tr><td>${new Date(row.timestamp).toLocaleTimeString()}</td><td>${s.cars||0}</td><td>${(s.buses||0)+(s.trucks||0)}</td><td style="color:var(--coral); font-weight:700;">${row.vehicles}</td></tr>`;
                });
                html += '</tbody></table>';
                tableDiv.innerHTML = html;
            }
        }
    } catch(e) {}
}

async function setSource(type) {
    const c = document.getElementById('videoContainer');
    if (!c) return;
    c.innerHTML = '<div style="color:var(--text-mid); padding:40px;"><i class="fas fa-spinner fa-spin"></i> Changement...</div>';
    try {
        await fetch('/api/set_source', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ type }) });
        showToast("Source changée", "info");
        setTimeout(() => {
            const ts = new Date().getTime();
            c.innerHTML = `<img id="videoStream" src="/video_feed?t=${ts}" style="width:100%; display:block; border-radius:12px;">`;
            showToast("Flux rétabli !", "success");
        }, 1500);
    } catch(e) { c.innerHTML = '<div style="color:var(--coral)">Erreur</div>'; }
}

const originalOnLoad = window.onload;
window.onload = () => {
    initMap();
    setInterval(fetchStatus, 500);
    loadIncidents();
    setInterval(loadIncidents, 5000);
    loadAnalytics();
    setInterval(loadAnalytics, 5000);
    if (originalOnLoad) originalOnLoad();
    initVoiceControl();
    const dz = document.getElementById('dropZone');
    const vi = document.getElementById('videoInput');
    if(dz && vi) {
        dz.onclick = () => vi.click();
        vi.onchange = () => {
            document.getElementById('fileName').innerText = vi.files[0].name;
            document.getElementById('fileInfo').style.display='block';
            document.getElementById('uploadBtn').disabled=false;
        };
        document.getElementById('uploadBtn').onclick = async () => {
            const f = new FormData(); f.append('file', vi.files[0]);
            await fetch('/api/upload_video', {method:'POST', body:f});
            showToast("Analyse terminée");
        };
    }
};
document.addEventListener('DOMContentLoaded', () => {
    document.querySelector('a[href="/analytics"]')?.addEventListener('click', loadAnalytics);
});
</script>

<script>
(function () {
  function apply(d) {
    for (const k in d.leds) {
      const a = document.getElementById(k);
      const b = document.getElementById('led' + k.charAt(0).toUpperCase() + k.slice(1));
      if (a) a.classList.toggle('on', d.leds[k]);
      if (b) b.classList.toggle('on', d.leds[k]);
    }
    const t1 = document.getElementById('trafficLight1');
    const t2 = document.getElementById('trafficLight2');
    if (t1) t1.classList.toggle('active', d.current_traffic_light === 1);
    if (t2) t2.classList.toggle('active', d.current_traffic_light === 2);
  }
  const es = new EventSource('/api/stream');
  es.onmessage = e => apply(JSON.parse(e.data));
})();
</script>

<script>
window.getTimerConfig = function () {
    try {
        const c = JSON.parse(localStorage.getItem('timerConfig'));
        return {
            yellow: Number(c && c.yellow) > 0 ? Number(c.yellow) : 4,
            green:  Number(c && c.green)  > 0 ? Number(c.green)  : 5
        };
    } catch (e) { return { yellow: 4, green: 5 }; }
};
</script>
</body>
</html>
