{% extends "base.html" %}
{% set active = 'chat' %}
{% block title %}Chatbot IA — Feu Rouge Intelligent{% endblock %}
{% block navbar_title %}Chatbot IA{% endblock %}
{% block content %}
<div class="content-section active">
    <div class="card">
        <h3><i class="fas fa-robot"></i> Assistant IA</h3>
        <div id="chatBox" class="chat-box"></div>
        <div style="display:flex; gap:10px;">
            <input type="text" id="chatInput" class="chat-input" placeholder="Ex: Switch vers feu 1...">
            <button class="btn btn-primary" onclick="sendChat()">Envoyer</button>
        </div>
    </div>
</div>
{% endblock %}
