{% extends "base.html" %}
{% set active = 'map' %}
{% block title %}Carte — GRID CONTROL{% endblock %}
{% block navbar_title %}Carte Live{% endblock %}
{% block subtitle %}Incidents · Signalement{% endblock %}

{% block content %}
<div class="bento">
    <div class="b-8 map-container" style="padding:0;">
        <div style="position:absolute; top:16px; left:16px; z-index:500; background:var(--surface); padding:10px 14px; border-radius:12px; border:1px solid var(--border); display:flex; gap:12px; align-items:center;">
            <strong style="font-size:13px;">Live Traffic</strong>
            <button class="btn btn-primary btn-sm" onclick="detectTrafficIncidents()">
                <i class="fas fa-radar"></i> Scanner
            </button>
        </div>
        <div id="map"></div>
    </div>

    <div class="b-4">
        <div class="bento-title"><i class="fas fa-exclamation-circle"></i> Signalement</div>
        <form id="incidentForm" style="display:flex; flex-direction:column; gap:10px;">
            <select id="incType" class="input">
                <option value="roadwork">🚧 Travaux</option>
                <option value="accident">💥 Accident</option>
                <option value="congestion">🚗 Bouchon</option>
            </select>
            <div style="display:flex; gap:8px;">
                <select id="incLight" class="input"><option value="1">Feu 1</option><option value="2">Feu 2</option></select>
                <select id="incidentSeverity" class="input"><option value="medium">Moyen</option><option value="high">Critique</option></select>
            </div>
            <button type="button" class="btn btn-danger" onclick="createIncident()" style="width:100%;">
                <i class="fas fa-plus"></i> Ajouter
            </button>
        </form>

        <div style="margin-top:24px;">
            <div class="bento-title" style="font-size:10px;">En cours</div>
            <div id="incidentsList">
                <p style="color:var(--text-lo); font-size:12px; text-align:center; padding:20px 0;">Aucun incident</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
